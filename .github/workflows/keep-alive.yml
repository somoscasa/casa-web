name: Keep Supabase awake

# Backup for the Vercel cron: Supabase free projects pause after a few idle days.
on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 60 https://casa-web-chi.vercel.app/api/cron/keep-alive)
            cat /tmp/out; echo " -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          exit 1
